{% extends 'notices/base.html' %}

{% block title %}Confirm the delete{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card text-center">
            <div class="card-header">
                <h3>Confirm the delete</h3>
            </div>
            <div class="card-body">
                <p>Do you really notice  "{{ notice.title }}" want to delete?</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">yes,delete</button>
                    <a href="{% url 'dashboard' %}" class="btn btn-secondary">No,Go back</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
